name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tmdb_certificate:
        description: Optional public certificate for a one-time encrypted TMDB credential transfer
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.cjs
      - run: python3 -m compileall -q tools scripts
      - run: bash -n scripts/build.sh service/autostart.sh
  tmdb-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.tmdb_certificate != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate credentials and encrypt private TV config
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_API_SECRET: ${{ secrets.TMDB_API_SECRET }}
          BOOTSTRAP_CERTIFICATE: ${{ inputs.tmdb_certificate }}
        run: python3 tools/export-tmdb-secret.py
      - uses: actions/upload-artifact@v4
        with:
          name: tmdb-encrypted-config
          path: ${{ runner.temp }}/tmdb-config.cms
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
