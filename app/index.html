<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的空间</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="poster.css">
  <link rel="stylesheet" href="sources.css">
  <link rel="stylesheet" href="trending.css">
</head>
<body data-scheme="hero">
  <main id="scene" class="scene" data-theme="dark" data-wallpaper="valley" aria-label="电视桌面">
    <div class="cover" aria-hidden="true">
      <div id="layerA" class="cover-layer is-visible">
        <img id="bgA" class="cover-bg" alt="">
        <img id="cardA" class="cover-card" alt="">
      </div>
      <div id="layerB" class="cover-layer">
        <img id="bgB" class="cover-bg" alt="">
        <img id="cardB" class="cover-card" alt="">
      </div>
      <div class="cover-left"></div>
    </div>
    <div class="cover-top" aria-hidden="true"></div>
    <div class="cover-bottom" aria-hidden="true"></div>

    <div class="wordmark">我的空间</div>
    <div class="top-right">
      <div id="weather" class="weather-widget" title="本地天气与日落" aria-label="本地天气">
        <span id="weatherIcon" class="weather-icon">☀️</span>
        <div class="weather-meta">
          <span id="weatherTemp" class="weather-temp">--°</span>
          <span id="weatherDesc" class="weather-desc">晴朗</span>
        </div>
      </div>
      <button id="theme" class="theme-toggle" type="button" data-key="theme" aria-label="切换浅色主题">
        <img class="theme-icon theme-icon-sun" src="assets/sun.svg" alt="">
        <img class="theme-icon theme-icon-moon" src="assets/moon.svg" alt="">
      </button>
      <div class="clock"><b id="clock"></b><span id="date"></span></div>
    </div>

    <div id="list" class="list" role="listbox" aria-label="应用列表">
      <div id="track" class="track"></div>
    </div>

    <button id="menu" class="menu" type="button" data-key="menu" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      <span>菜单</span>
    </button>

    <div id="menuPanel" class="menu-panel" hidden>
      <button class="menu-item" type="button" data-action="all">全部应用</button>
      <button class="menu-item" type="button" data-action="trending">探索热门</button>
      <button class="menu-item" type="button" data-action="inputs">输入源</button>
      <button class="menu-item" type="button" data-action="network">网络连接<small id="vpnLabel">打开网络设置</small></button>
      <button class="menu-item" type="button" data-action="settings">设置</button>
    </div>

    <section id="cinemaView" class="cinema-view" hidden aria-label="探索热门影视">
      <div class="cinema-cover" aria-hidden="true">
        <div id="cinemaLayerA" class="cinema-layer is-visible">
          <img id="cinemaBgA" class="cinema-bg" alt="">
        </div>
        <div id="cinemaLayerB" class="cinema-layer">
          <img id="cinemaBgB" class="cinema-bg" alt="">
        </div>
        <div class="cinema-scrim"></div>
      </div>

      <header class="cinema-top">
        <button id="cinemaBack" class="cinema-back" type="button" aria-label="返回桌面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>返回桌面</span>
        </button>

        <div class="cinema-tabs" role="tablist" aria-label="影视分类">
          <button id="cinemaTabMovie" class="cinema-tab active" type="button" role="tab" aria-selected="true" data-tab="movie">本周电影</button>
          <button id="cinemaTabTv" class="cinema-tab" type="button" role="tab" aria-selected="false" data-tab="tv">本周剧集</button>
        </div>

        <div class="cinema-status" aria-live="polite">
          <span class="cinema-status-dot" aria-hidden="true"></span>
          <span id="cinemaStatusText">TMDB 周趋势 · 电视离线缓存</span>
        </div>
      </header>

      <div class="cinema-stage">
        <div class="cinema-meta-row">
          <span id="cinemaScore" class="cinema-badge"></span>
          <span id="cinemaGenre" class="cinema-pill"></span>
          <span id="cinemaDate" class="cinema-pill"></span>
        </div>

        <h1 id="cinemaTitle" class="cinema-title"></h1>
        <div id="cinemaOrigin" class="cinema-origin"></div>
        <p id="cinemaDesc" class="cinema-desc"></p>
      </div>

      <footer class="cinema-shelf">
        <div class="cinema-shelf-head">
          <span>每周趋势雷达 · 左右键浏览</span>
          <small>按返回键 (Back) 退出</small>
        </div>
        <div class="cinema-track-wrap">
          <div id="cinemaTrack" class="cinema-track" role="listbox" aria-label="作品列表"></div>
        </div>
      </footer>
    </section>

    <div class="caption" aria-live="polite">
      <b id="captionTitle"></b>
      <span id="captionText"></span>
    </div>

    <div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div><h2 id="dialog-title">全部应用</h2></div><button id="close" class="icon-button" aria-label="关闭"><img src="assets/x.svg" alt=""></button></header><div id="dialog-body"></div></section></div>
    <div id="toast" role="status"></div>
  </main>

  <script src="gsap.min.js"></script>
  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="device.js"></script>
  <script src="theme.js"></script>
  <script src="weather.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
