<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" class="scene" data-theme="dark" data-wallpaper="valley" aria-label="电视桌面">
    <header class="header">
      <div><p class="eyebrow">我的空间</p><h1 id="greeting">晚上好</h1></div>
      <div class="header-right"><div class="datetime"><time id="clock">18:10</time><p id="date">10月21日，星期三</p></div><div class="header-divider"></div><button id="theme" class="icon-button" data-key="theme" aria-label="切换明暗主题"><img src="assets/sun.svg" alt=""></button><button id="settings" class="icon-button" data-key="settings" aria-label="外观设置"><img src="assets/settings.svg" alt=""></button></div>
    </header>

    <div class="section-head"><span>我的设备</span><div><span>常用应用</span><button id="edit" class="text-button" data-key="edit"><img src="assets/layout-grid.svg" alt="">编辑桌面</button></div></div>

    <section class="board" aria-label="设备与常用应用">
      <button id="computer" class="computer tile" data-key="computer" aria-label="电脑，切换到 HDMI 4">
        <div class="computer-photo"></div><div class="computer-shade"></div>
        <span class="device-badge"><img src="assets/device-desktop.svg" alt="">常用输入源</span>
        <div class="computer-label"><span class="device-port">HDMI 4</span><h2>电脑</h2><p>切换到电脑输入源</p></div>
        <span class="open-arrow"><img src="assets/arrow-up-right.svg" alt=""></span>
      </button>
      <div id="apps" class="apps" aria-label="常用应用"></div>
    </section>

    <nav class="utilities" aria-label="桌面工具">
      <button id="all" data-key="all" class="utility"><span class="utility-icon"><img src="assets/layout-grid.svg" alt=""></span><span><strong>全部应用</strong><small>查看与管理</small></span><img class="utility-arrow" src="assets/arrow-up-right.svg" alt=""></button>
      <button id="inputs" data-key="inputs" class="utility"><span class="utility-icon"><img src="assets/plug-connected.svg" alt=""></span><span><strong>输入源</strong><small>HDMI 与直播电视</small></span><img class="utility-arrow" src="assets/arrow-up-right.svg" alt=""></button>
      <button id="network" data-key="network" class="utility"><span class="utility-icon"><img src="assets/shield-lock.svg" alt=""></span><span><strong>网络连接</strong><small id="vpnLabel">打开 Alcyone VPN</small></span><img class="utility-arrow" src="assets/arrow-up-right.svg" alt=""></button>
      <button id="appearance" data-key="appearance" class="utility"><span class="utility-icon"><img src="assets/settings.svg" alt=""></span><span><strong>设置</strong><small>外观与桌面</small></span><img class="utility-arrow" src="assets/arrow-up-right.svg" alt=""></button>
    </nav>

    <footer class="footer"><span></span><div><span class="key">↑↓←→</span> 选择<span class="key enter">确认</span> 打开<span class="key">长按确认</span> 排序</div></footer>

    <div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div><p id="dialog-kicker" class="eyebrow">我的空间</p><h2 id="dialog-title">全部应用</h2></div><button id="close" class="icon-button" aria-label="关闭"><img src="assets/x.svg" alt=""></button></header><div id="dialog-body"></div><p class="dialog-foot">方向键选择 · 确认键操作 · 返回键关闭</p></section></div>
    <div id="toast" role="status"></div>
  </main>
  <aside class="preview-note">浏览器预览 · 设备操作需在电视上使用<span>方向键 / Enter / Esc，也可用鼠标操作</span></aside>
  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="device.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
